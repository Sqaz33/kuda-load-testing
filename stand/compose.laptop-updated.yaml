name: kuda-nt
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '3'
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: kuda
      POSTGRES_PASSWORD: kuda_local_dev
      POSTGRES_DB: kuda
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on, -c, track_wal_io_timing=on, -c, max_connections=180, -c, log_min_duration_statement=250, -c, log_lock_waits=on, -c, shared_buffers=256MB]
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 1500m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kuda -d kuda]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --requirepass, kuda_local_dev, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped
  migrate:
    image: venue-backend:nt-metrics
    entrypoint: [/app/migrate]
    command: [up]
    environment:
      DATABASE_URL: postgres://kuda:kuda_local_dev@postgres:5432/kuda?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {disable: true}
    logging: *logging
  api:
    image: venue-backend:nt-metrics
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      HTTP_ADDR: :8787
      DB_MAX_CONNS: 150
      DATABASE_URL: postgres://kuda:kuda_local_dev@postgres:5432/kuda?sslmode=disable
      REDIS_URL: redis://:kuda_local_dev@redis:6379/0
      CORS_ALLOWED_ORIGINS: http://192.168.0.242:8081,http://192.168.0.213:8081
    ports: ['192.168.0.213:8787:8787']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    mem_limit: 1g
    init: true
    logging: *logging
    restart: unless-stopped
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_NAME: postgres://kuda:kuda_local_dev@postgres:5432/kuda?sslmode=disable
    ports: ['192.168.0.213:9187:9187']
    command: [--collector.stat_statements]
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    command: [--docker_only=true, --housekeeping_interval=5s, --store_container_labels=true]
    ports: ['192.168.0.213:8088:8080']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped
volumes:
  postgres-data:

