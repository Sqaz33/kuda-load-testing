name: kuda-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d, --web.enable-admin-api]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 20m, max-file: '3'}}
  results-exporter:
    image: python:3.12.10-slim
    command: [python, -u, /app/results_exporter.py]
    ports: ['127.0.0.1:9199:9199']
    volumes:
      - ./results_exporter.py:/app/results_exporter.py:ro
      - ../:/work:ro
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 20m, max-file: '3'}}
volumes:
  prometheus-data:
