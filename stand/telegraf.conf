[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false
[[inputs.docker]]
  endpoint = "npipe:////./pipe/docker_engine"
  timeout = "5s"


  docker_label_include = ["com.docker.compose.service", "com.docker.compose.project"]
[[outputs.prometheus_client]]
  listen = "192.168.0.213:9273"
  metric_version = 2

